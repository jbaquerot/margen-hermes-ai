[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "margen-hermes"
version = "0.1.0"
description = "Notas de lectura para un perfil personal de Hermes Agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9", "python-telegram-bot==22.8"]
search = ["onnxruntime>=1.23,<2", "tokenizers>=0.21,<1", "numpy>=1.26,<3"]

[tool.setuptools]
package-dir = {"" = "plugins/margen"}

[tool.setuptools.packages.find]
where = ["plugins/margen"]
include = ["margen*"]

[tool.setuptools.package-data]
margen = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["plugins/margen"]
testpaths = ["tests"]
addopts = "-ra"
